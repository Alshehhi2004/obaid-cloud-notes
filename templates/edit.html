{% extends 'base.html' %}{% block title %}{{ 'Edit note' if editing else 'New note' }} · Cloud Notes{% endblock %}{% block content %}
<section class="editor"><a class="back" href="{{ url_for('dashboard') }}">← My notebook</a><div class="eyebrow">A LITTLE THOUGHT, SAVED</div><h1>{{ 'Give it another thought.' if editing else 'What’s on your mind?' }}</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="title">Title</label><input class="title-input" id="title" name="title" required maxlength="120" value="{{ note.title if note else '' }}" placeholder="Give your idea a name"><label for="body">Your note</label><textarea id="body" name="body" required maxlength="10000" rows="10" placeholder="Start with a thought…">{{ note.body if note else '' }}</textarea><div class="editor-actions"><span class="hint">Saved to your personal notebook.</span><button class="button" type="submit">Save note ↗</button></div></form></section>
{% endblock %}
