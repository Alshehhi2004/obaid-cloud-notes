---
- name: Prepare the existing shared PostgreSQL database
  hosts: controller
  become: true
  gather_facts: false
  tasks:
    - name: Check that exactly two application nodes are defined
      ansible.builtin.assert:
        that:
          - groups['webservers'] | length == 2
          - gateway_private_ip is defined
          - gateway_public_ip is defined

    - name: Read existing database and session configuration privately
      ansible.builtin.slurp:
        src: /etc/cloud-notes/app.env
      register: notes_environment
      no_log: true

    - name: Retain existing credentials so users and notes remain valid
      ansible.builtin.set_fact:
        notes_database_password: "{{ ((notes_environment.content | b64decode | regex_findall('(?m)^DATABASE_URL=(.+)$') | first) | urlsplit('password')) }}"
        notes_session_secret: "{{ notes_environment.content | b64decode | regex_findall('(?m)^SECRET_KEY=(.+)$') | first }}"
      no_log: true

    - name: Validate credentials generated by the single-server installer
      ansible.builtin.assert:
        that:
          - notes_database_password is match('^[a-f0-9]{48}$')
          - notes_session_secret is match('^[a-f0-9]{64}$')
        fail_msg: Existing generated credentials could not be read. Do not create a new database.
      no_log: true

    - name: Locate PostgreSQL cluster configuration
      ansible.builtin.find:
        paths: /etc/postgresql
        patterns: postgresql.conf
        recurse: true
        file_type: file
      register: pg_configs

    - name: Ensure the expected single PostgreSQL cluster exists
      ansible.builtin.assert:
        that: pg_configs.matched == 1
        fail_msg: Expected one PostgreSQL cluster; inspect its configuration before proceeding.

    - name: Listen only on loopback and the gateway private IP
      ansible.builtin.lineinfile:
        path: "{{ pg_configs.files[0].path }}"
        regexp: '^#?listen_addresses\s*='
        line: "listen_addresses = '127.0.0.1,{{ gateway_private_ip }}'"
      notify: Restart PostgreSQL

    - name: Ensure PostgreSQL TLS is enabled
      ansible.builtin.lineinfile:
        path: "{{ pg_configs.files[0].path }}"
        regexp: '^#?ssl\s*='
        line: 'ssl = on'
      notify: Restart PostgreSQL

    - name: Allow the two application IPs to authenticate over database TLS
      ansible.builtin.blockinfile:
        path: "{{ pg_configs.files[0].path | dirname }}/pg_hba.conf"
        marker: '# {mark} CLOUD NOTES BONUS APPLICATION NODES'
        block: |
          {% for node in groups['webservers'] %}
          hostssl cloudnotes cloudnotes {{ hostvars[node].ansible_host }}/32 scram-sha-256
          {% endfor %}
      notify: Restart PostgreSQL

    - name: Apply database network configuration before deploying the app nodes
      ansible.builtin.meta: flush_handlers

  handlers:
    - name: Restart PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: restarted

- name: Configure both application instances
  hosts: webservers
  become: true
  gather_facts: false
  serial: 1
  tasks:
    - name: Wait until SSH is ready
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Wait for the OpenTofu launch script to finish
      ansible.builtin.command: cloud-init status --wait
      register: cloud_init_result
      changed_when: false

    - name: Install application runtime and host firewall
      ansible.builtin.apt:
        name: [git, python3-venv, python3-pip, curl, ufw]
        state: present
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 300

    - name: Ensure the app folder belongs to the app user
      ansible.builtin.file:
        path: /opt/website
        state: directory
        owner: ubuntu
        group: ubuntu

    - name: Download the application code
      become_user: ubuntu
      ansible.builtin.git:
        repo: https://github.com/Alshehhi2004/obaid-cloud-notes.git
        dest: /opt/website
        version: main
        update: true
      notify: Restart application

    - name: Install Python dependencies inside the application virtual environment
      become_user: ubuntu
      ansible.builtin.pip:
        requirements: /opt/website/requirements.txt
        virtualenv: /opt/website/.venv
        virtualenv_command: python3 -m venv
      notify: Restart application

    - name: Create the private configuration directory
      ansible.builtin.file:
        path: /etc/cloud-notes
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Configure shared database, shared session secret and unique instance name
      ansible.builtin.template:
        src: app.env.j2
        dest: /etc/cloud-notes/app.env
        owner: root
        group: root
        mode: '0600'
      no_log: true
      notify: Restart application

    - name: Install the application service
      ansible.builtin.template:
        src: cloud-notes.service.j2
        dest: /etc/systemd/system/cloud-notes.service
        owner: root
        group: root
        mode: '0644'
      notify: Restart application

    - name: Set the host firewall default incoming policy
      ansible.builtin.command: ufw default deny incoming
      changed_when: false

    - name: Allow SSH for administration before enabling the host firewall
      ansible.builtin.command: ufw allow 22/tcp
      environment:
        LC_ALL: C
      register: ufw_ssh
      changed_when: "'Skipping' not in ufw_ssh.stdout"

    - name: Allow application traffic only from the gateway private IP
      ansible.builtin.command:
        argv:
          - ufw
          - allow
          - from
          - "{{ hostvars['gateway'].gateway_private_ip }}"
          - to
          - any
          - port
          - '8000'
          - proto
          - tcp
      environment:
        LC_ALL: C
      register: ufw_app
      changed_when: "'Skipping' not in ufw_app.stdout"

    - name: Check whether the host firewall is active
      ansible.builtin.command: ufw status
      environment:
        LC_ALL: C
      register: ufw_status
      changed_when: false

    - name: Enable the host firewall
      ansible.builtin.command: ufw --force enable
      when: "'Status: active' not in ufw_status.stdout"
      changed_when: true

    - name: Apply service changes
      ansible.builtin.meta: flush_handlers

    - name: Ensure the application is enabled and started
      ansible.builtin.systemd_service:
        name: cloud-notes
        daemon_reload: true
        enabled: true
        state: started

    - name: Verify the node can use the shared database
      ansible.builtin.uri:
        url: http://127.0.0.1:8000/health
        return_content: true
        status_code: 200
      register: node_health
      until: node_health.status | default(0) == 200
      retries: 15
      delay: 2

    - name: Confirm this node has its own identity
      ansible.builtin.assert:
        that:
          - node_health.json.database == 'connected'
          - node_health.json.served_by == inventory_hostname

  handlers:
    - name: Restart application
      ansible.builtin.systemd_service:
        name: cloud-notes
        daemon_reload: true
        enabled: true
        state: restarted

- name: Switch the gateway to load balancing
  hosts: controller
  become: true
  gather_facts: false
  tasks:
    - name: Ensure the existing HTTPS certificate is present
      ansible.builtin.stat:
        path: /etc/letsencrypt/live/cloud-notes-ip/fullchain.pem
      register: gateway_certificate

    - name: Require the completed HTTPS bonus configuration
      ansible.builtin.assert:
        that: gateway_certificate.stat.exists

    - name: Verify both app nodes are reachable from the gateway
      ansible.builtin.uri:
        url: "http://{{ hostvars[item].ansible_host }}:8000/health"
        return_content: true
        status_code: 200
      loop: "{{ groups['webservers'] }}"

    - name: Back up the existing single-server Nginx configuration once
      ansible.builtin.copy:
        src: /etc/nginx/sites-available/cloud-notes
        dest: /etc/nginx/cloud-notes-single.backup
        remote_src: true
        force: false
        mode: '0644'

    - name: Render the load balancer configuration
      ansible.builtin.template:
        src: nginx-bonus.conf.j2
        dest: /etc/nginx/sites-available/cloud-notes
        owner: root
        group: root
        mode: '0644'
      register: nginx_configuration

    - name: Check Nginx configuration before reloading
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Reload Nginx after configuration changes
      ansible.builtin.service:
        name: nginx
        state: reloaded
      when: nginx_configuration.changed

    - name: Verify the internal load balancer listener
      ansible.builtin.uri:
        url: http://127.0.0.1:8081/health
        return_content: true
        status_code: 200
      register: gateway_health
      until: gateway_health.status | default(0) == 200
      retries: 10
      delay: 2

    - name: Stop the old single-server app so only the two new nodes serve requests
      ansible.builtin.systemd_service:
        name: cloud-notes
        state: stopped
        enabled: false

    - name: Report deployment result without secrets
      ansible.builtin.debug:
        msg:
          - 'Two app nodes now share the existing PostgreSQL database.'
          - 'Nginx balances requests on HTTPS 443 and local-only port 8081.'
          - 'Change the laptop SSH forward target from localhost:8000 to localhost:8081.'
          - 'Keep cloudflared pointed at the laptop port 8080.'
